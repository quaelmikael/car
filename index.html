<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar Events</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", sans-serif;
    background: transparent;
    padding:20px;
}

.calendar-container{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:16px;
    width:100%;
}

.card{
    height:320px;
    perspective:1200px;
    cursor:pointer;
}

.card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.8s ease;
    transform-style:preserve-3d;
}

.card.flipped .card-inner{
    transform:rotateY(180deg);
}

.front,
.back{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.front{
    background:#fff;
}

.front img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.back{
    background:white;
    transform:rotateY(180deg);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:20px;
    text-align:center;
}

.back h3{
    margin-bottom:12px;
    color:#003366;
    font-size:20px;
}

.back p{
    color:#666;
    line-height:1.5;
}

.back small{
    margin-top:15px;
    color:#999;
}

@media (max-width:1400px){
    .calendar-container{
        grid-template-columns:repeat(3,1fr);
    }
}

@media (max-width:768px){
    .calendar-container{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="calendar-container">

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <img src="https://quaelmikael.github.io/car/1.png" alt="Event 1">
            </div>
            <div class="back">
                <h3>Event Title</h3>
                <p>Event description goes here.</p>
                <small>Click again to flip back</small>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <img src="https://quaelmikael.github.io/car/2.png" alt="Event 2">
            </div>
            <div class="back">
                <h3>Event Title</h3>
                <p>Event description goes here.</p>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <img src="https://quaelmikael.github.io/car/3.png" alt="Event 3">
            </div>
            <div class="back">
                <h3>Event Title</h3>
                <p>Event description goes here.</p>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <img src="https://quaelmikael.github.io/car/4.png" alt="Event 4">
            </div>
            <div class="back">
                <h3>Event Title</h3>
                <p>Event description goes here.</p>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <img src="https://quaelmikael.github.io/car/5.png" alt="Event 5">
            </div>
            <div class="back">
                <h3>Event Title</h3>
                <p>Event description goes here.</p>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <img src="https://quaelmikael.github.io/car/6.png" alt="Event 6">
            </div>
            <div class="back">
                <h3>Event Title</h3>
                <p>Event description goes here.</p>
            </div>
        </div>
    </div>

</div>

<script>
// Smooth Flip Animation Toggle
document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
        card.classList.toggle("flipped");
    });
});

// Case-Insensitivity & Extension Fallback Engine
document.querySelectorAll('.front img').forEach(img => {
    img.dataset.attempt = "0";
    
    img.addEventListener('error', function() {
        let attempt = parseInt(this.dataset.attempt);
        const baseUrl = "https://quaelmikael.github.io/car/";
        const cardNum = this.alt.replace("Event ", ""); 
        
        attempt++;
        this.dataset.attempt = attempt.toString();
        
        if (attempt === 1) {
            // Try uppercase PNG
            this.src = baseUrl + cardNum + ".PNG";
        } else if (attempt === 2) {
            // Try lowercase JPG
            this.src = baseUrl + cardNum + ".jpg";
        } else if (attempt === 3) {
            // Try uppercase JPG
            this.src = baseUrl + cardNum + ".JPG";
        } else if (attempt === 4) {
            // Try lowercase JPEG
            this.src = baseUrl + cardNum + ".jpeg";
        } else if (attempt === 5) {
            // Try uppercase JPEG
            this.src = baseUrl + cardNum + ".JPEG";
        } else {
            // If everything fails, display a diagnostic notice on the card front
            const frontDiv = this.parentElement;
            frontDiv.innerHTML = `
                <div style="padding: 20px; text-align: center; color: #b71c1c; font-size: 13px; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: #ffebee;">
                    <strong>Image ${cardNum} Not Found</strong>
                    <span style="font-size: 11px; color: #555; margin-top: 8px; line-height: 1.4;">
                        Confirm that <strong>${cardNum}</strong> exists at the root of your repository and isn't nested inside an 'images' folder.
                    </span>
                </div>`;
        }
    });
});
</script>

</body>
</html>
